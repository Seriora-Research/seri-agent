name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "You are reviewing a PR in the seri repo — this workflow is review-only, always: never push, merge, or approve, no matter what the mention asks for. Apply this repo's own rubric — AGENTS.md's 'Seri Code Review Guidelines' and .claude/rules/code-quality.md (its rules apply here as review criteria, not as instructions for you to follow while authoring) — read them, don't restate them.

            If the PR is large, triage before reading everything in full: skim the diff to find the highest-risk files first, then read those in full for context. Only flag real correctness bugs, genuine edge cases, out-of-scope changes, or clear structural regressions. Skip style/naming nits and don't relitigate conventions this PR already matches.

            Post each finding with the inline-comment tool available to you, one call per finding with its confirmed argument set to true, one or two sentences each — file, line, the concrete failure, not vague 'consider' language. Inline comments can only anchor to lines in the diff; for a real finding outside the diff, or if there's nothing to flag, use the general PR comment tool instead and say so briefly.

            For CI failures, pull real job logs with the CI tools available to you before commenting — don't guess from file/line coincidences."
